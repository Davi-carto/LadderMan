  transformer_vision_depth:
    concatenate_terms: true
    concatenate_dim: -1
    enable_corruption: false
    history_length: null
    flatten_history_dim: true
    image:
      func: ladder.tasks.ladder_climb.mdp.observations:warp_visual_depth
      params:
        robot_name: robot
        ladder_name: ladder
        camera_body_name: d435_head_link
