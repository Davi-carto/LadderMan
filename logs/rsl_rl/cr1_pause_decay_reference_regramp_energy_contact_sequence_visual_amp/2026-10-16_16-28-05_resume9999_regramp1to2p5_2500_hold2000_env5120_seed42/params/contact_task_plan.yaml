  reward_weight_per_meter: 0.5
  reward: signed distance decrease, fixed low weight in all phases; reset/goal changes
    do not pay
  distance_deadband_m: 0.1
  completion: soft shaping only; no additional completion gate
  metrics:
  - body_target_distance_m
  - body_goal_progress_m
  - body_completion_error_m
foot_safety:
  limbs:
  - left_foot
  - right_foot
  surface_source: per-foot per-rung filtered normal forces; mixed contacts are approximate
  surface_scope: all ladder rungs, including source/target; no ground or hand penalties
  force_threshold_n: 5.0
  min_top_normal_fraction: 0.5
  front_side_weight_per_foot_second: -3.0
  underside_weight_per_foot_second: -3.0
  pose_weight_per_foot_second: -1.0
  pose_pitch_range_deg: !!python/tuple
  - -55.0
  - 15.0
  pose_side_tilt_limit_deg: 20.0
  pose_error_scale_deg: 30.0
  pose_axes: ankle-link +X=toe, +Y=lateral, +Z=sole up; positive pitch means toe up
  pose_scope: active feet in release/move/unconfirmed acquire, or actually airborne;
    pre-phase-update
  pose_penalty: squared angular excess plus upside-down penalty, capped at one per
    foot
  completion: unchanged; this experiment adds penalties only
  metrics: foot_left/right_* exposure durations, force/angle peaks, pose-error integral;
    retained on reset
next_support_source: stable_support_rung_id[next_stable_anchor]
reset_sampling: uniform frames [0, final_anchor), then stable_reset_segment_ids[frame]
deadline: max(10 s, 2 * remaining reference duration + 1 s)
episode_length_s: 320.0
fall_confirmation_steps: 10
collision_confirmation_steps: 20
limb_order:
- left_hand
- right_hand
- left_foot
- right_foot
reward_units: rates multiplied by dt; progress in meters; bonuses once per event
ground_support_detection: ankle net force, no rung force, abs(foot z - env origin
  z) <= tolerance
ground_height_tolerance_m: 0.12
